<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Malvagos</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: #f7f6f2; color: #172033; font: 15px Arial, sans-serif; }
    input, button, select { font: inherit; padding: 8px 11px; border: 1px solid #e5e2dc; border-radius: 7px; background: #fff; color: inherit; }
    input:disabled { background: #faf9f6; color: #8a93a3; }
    button { cursor: pointer; background: #b8860b; color: #fff; border: 0; font-weight: 600; }
    button.ghost { background: #fff; color: #172033; border: 1px solid #e5e2dc; font-weight: 400; }
    button.danger { background: #fff; color: #b42318; border: 1px solid #e5e2dc; font-weight: 400; }
    button.sm { padding: 2px 9px; }

    #auth { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .login-box { width: min(100%, 300px); padding: 14px; background: #fff; border: 1px solid #e8e5df; border-radius: 9px; }
    .login-box h2 { margin: 0 0 12px; font-size: 16px; color: #b8860b; }
    .login-box h2 b { color: #172033; }
    #login { display: grid; gap: 6px; }
    #login label { margin-top: 3px; color: #666; font-size: 11px; }
    #login input { width: 100%; font-size: 13px; }
    #login button { width: 100%; margin-top: 4px; }
    .login-box small { display: block; margin-top: 10px; color: #777; font-size: 10px; }

    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid #e8e5df; }
    .topbar h1 { margin: 0; font-size: 19px; color: #b8860b; }
    .topbar h1 b { color: #172033; }
    .meta { display: flex; align-items: center; gap: 12px; color: #667085; font-size: 13px; }
    .app-shell { padding: 0 16px 40px; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; }
    nav button { background: #fff; color: #172033; border: 1px solid #e5e2dc; font-weight: 400; }
    nav button.active { background: #b8860b; color: #fff; border-color: #b8860b; font-weight: 600; }
    #content { max-width: 970px; margin: 0 auto; }

    .card { overflow-x: auto; margin: 0 0 14px; padding: 14px; background: #fff; border: 1px solid #ece9e3; border-radius: 10px; }
    .card h2 { margin: 0 0 10px; font-size: 15px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .seg button { padding: 11px; background: #fff; color: #172033; border: 1px solid #e5e2dc; font-weight: 400; }
    .seg button.on { background: #b8860b; color: #fff; border-color: #b8860b; font-weight: 600; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
    .chip { background: #fff; color: #172033; border: 1px solid #e5e2dc; white-space: nowrap; font-weight: 400; }
    .chip.on { background: #b8860b; color: #fff; border-color: #b8860b; font-weight: 600; }
    .search { width: 100%; margin-bottom: 10px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 8px; max-height: 270px; overflow: auto; padding-right: 4px; }
    .tile { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 8px 10px; text-align: left; background: #fff; color: #172033; border: 1px solid #e5e2dc; border-radius: 6px; font-weight: 400; }
    .tile span { font-size: 12px; color: #667085; }
    .qty { width: 80px; padding: 5px 8px; text-align: center; font-weight: 700; }

    .sumline { display: flex; justify-content: space-between; padding-bottom: 8px; border-bottom: 2px solid #b8860b; }
    .pay { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
    .big { font-size: 24px; font-weight: 700; color: #1a7f37; }
    .stats3 { display: flex; flex-wrap: wrap; gap: 44px; }
    .stats3 small { display: block; margin-bottom: 4px; color: #667085; font-size: 12px; }
    .stats3 b { font-size: 17px; }

    table { width: 100%; border-collapse: collapse; }
    th { color: #667085; font-size: 12px; font-weight: 700; }
    th, td { padding: 8px; border-bottom: 1px solid #eee; text-align: left; vertical-align: middle; }
    td.name { font-weight: 700; }
    tr.cat td { background: #f3efe6; color: #b8860b; font-weight: 700; }
    .n { width: 78px; padding: 7px 9px; }
    .fl { display: flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
    .fl input { padding: 0; }
    .dot { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; border-radius: 50%; background: #d9d2e6; }
    .dot.on { background: #2fb344; }
    .muted { color: #667085; }
    .note { margin: 10px 0 0; color: #667085; font-size: 13px; }
    .pos { color: #1a7f37; font-weight: 600; }
    .neg { color: #c0392b; font-weight: 600; }
    .hidden { display: none !important; }

    #message { position: fixed; z-index: 2; top: 12px; left: 50%; transform: translateX(-50%); padding: 10px 14px; white-space: pre-wrap; background: #fff; border-radius: 6px; box-shadow: 0 2px 8px #0002; }
    #message:empty { display: none; }
    #message.error { color: #a11; }
    #message.success { color: #176b37; }
  </style>
</head>
<body>
  <div id="message" role="status"></div>

  <section id="auth">
    <div class="login-box">
      <h2>◆ Malvagos <b>Login</b></h2>
      <form id="login">
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="E-mail" autocomplete="username" required>
        <label for="password">Adgangskode</label>
        <input id="password" type="password" placeholder="Adgangskode" autocomplete="current-password" required>
        <button type="submit">Log ind</button>
      </form>
      <small>Kun for medlemmer.</small>
    </div>
  </section>

  <section id="app" class="hidden">
    <header class="topbar">
      <h1>◆ Malvagos <b>System</b></h1>
      <div class="meta">
        <span id="stats"></span>
        <span id="who"></span>
        <button id="logout" class="ghost" type="button">Log ud</button>
      </div>
    </header>
    <div class="app-shell">
      <nav id="tabs"></nav>
      <main id="content"></main>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://awkenudlyzexprjqpvcu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_4njY-sWB9J2UTcmNmQuuDA_b5bLC4Vp";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const tabs = ["Ind/ud", "Handler", "Lager", "Medlemmer", "Kontingent", "Kontingent-historik"];
    const months = ["Januar", "Februar", "Marts", "April", "Maj", "Juni", "Juli", "August", "September", "Oktober", "November", "December"];
    const now = new Date();
    const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    let me = null, profile = null, currentTab = "Ind/ud", startCounter = 0, histMember = "";
    let payDate = isoLocal(now);
    let period = { month: now.getMonth() + 1, year: now.getFullYear() };
    let stockCache = [], cart = {}, cashType = "ind", cat = "Alle", lcat = "Alle", hType = "alle";

    // Varer fra Pawnshop-systemet: [navn, kategori, købspris, salgspris, B=Vi køber / S=Vi sælger]
    const SEED_ITEMS = [
      ["Bagpanel", "Elektronik", 500, 500, "B"], ["Dekrypteringsenhed", "Elektronik", 200, 200, "B"], ["Kabler", "Elektronik", 700, 700, "B"], ["KryptaNode Modul", "Elektronik", 1250, 5000, "S"], ["Xeltrix Enhed", "Elektronik", 1250, 5000, "S"], ["SFruit S420", "Elektronik", 7500, 24500, "BS"], ["Ødelagt Vinkelsliber", "Elektronik", 350, 455, "B"], ["Slagboremaskine", "Elektronik", 3000, 8500, "BS"], ["Rød USB", "Elektronik", 25000, 40000, "BS"], ["Blå USB", "Elektronik", 35000, 45500, "BS"], ["Grøn USB", "Elektronik", 40000, 52000, "BS"], ["Vinkelsliber", "Elektronik", 0, 12000, "S"], ["Gul boremaskine", "Elektronik", 0, 7500, "S"], ["Ordrelister M/ Materialer", "Elektronik", 0, 250, "S"], ["Ordrelister U/ Materialer", "Elektronik", 0, 500, "S"],
      ["Normal Lockpick", "Lockpicks", 400, 1000, "S"], ["Advanced Lockpick", "Lockpicks", 250, 5000, "S"],
      ["C4", "Andet", 50000, 70000, "BS"], ["Bandage", "Andet", 200, 1500, "S"], ["Sportstaske", "Andet", 500, 10000, "BS"], ["Nummerplade", "Andet", 4500, 10000, "BS"], ["Stofsæk", "Andet", 15, 20, "B"], ["Strips", "Andet", 15, 20, "BS"], ["Lighter", "Andet", 15, 20, "B"], ["Skruetrækkersæt", "Andet", 0, 15000, "S"], ["Tablet", "Andet", 0, 17000, "S"], ["Nexdrive USB", "Andet", 0, 7000, "S"], ["A Kontrakt", "Andet", 50000, 150000, "B"], ["B Kontrakt", "Andet", 1000, 12500, "BS"],
      ["Gummi", "Materialer", 120, 155, "B"], ["Stål", "Materialer", 150, 195, "B"], ["Glas", "Materialer", 120, 155, "B"], ["Metalskrot", "Materialer", 110, 145, "B"], ["Elektronik", "Materialer", 100, 130, "B"], ["Tekstil", "Materialer", 50, 65, "B"], ["Træ", "Materialer", 20, 25, "B"], ["Aluminium", "Materialer", 110, 145, "B"], ["Plastik", "Materialer", 110, 145, "B"], ["Kobber", "Materialer", 120, 155, "B"], ["Genbrugsmaterialer", "Materialer", 350, 455, "B"], ["guld spaydåse", "Materialer", 0, 0, "BS"],
      ["Raf. Gummi", "Raffinerede materialer", 1200, 1560, "B"], ["Raf. Stål", "Raffinerede materialer", 1500, 1950, "B"], ["Raf. Glas", "Raffinerede materialer", 600, 780, "B"], ["Raf. Metal", "Raffinerede materialer", 1000, 1300, "B"], ["Raf. El", "Raffinerede materialer", 600, 780, "B"], ["Raf. Træ", "Raffinerede materialer", 600, 780, "BS"], ["Raf. Alu", "Raffinerede materialer", 1000, 1300, "B"], ["Raf. Plastik", "Raffinerede materialer", 1000, 1300, "B"], ["Raf. Kobber", "Raffinerede materialer", 1200, 1560, "B"],
      ["T1 alle", "Stoffer", 100, 1000, "S"], ["T2 alle", "Stoffer", 1000, 2500, "BS"], ["T3 Coke", "Stoffer", 2500, 3700, "BS"], ["T3 Heroin", "Stoffer", 2500, 3700, "BS"], ["T3 Weed", "Stoffer", 2500, 3700, "BS"], ["Flyd. Gødning", "Stoffer", 100, 150, "BS"], ["Pakker, kanyler mm.", "Stoffer", 50, 250, "BS"], ["3. Stjernet Vand", "Stoffer", 100, 220, "BS"], ["3. Stjernet Gødning", "Stoffer", 100, 220, "BS"], ["ladybug", "Stoffer", 0, 100, "BS"],
      ["Veste", "Veste & Plader", 5000, 25000, "BS"], ["Plade Tier. 1", "Veste & Plader", 7500, 14000, "BS"], ["Plade Tier. 2", "Veste & Plader", 12500, 19500, "BS"], ["Plade Tier. 3", "Veste & Plader", 17500, 25500, "BS"], ["Fuld sæt Plader", "Veste & Plader", 45000, 75000, "BS"],
      ["Ext. Mag", "Accessories", 25000, 50000, "S"], ["Lyddæmper", "Accessories", 20000, 50000, "S"], ["Taktisk Lyddæmper", "Accessories", 0, 30000, "S"], ["Taktisk Lommelygte", "Accessories", 0, 30000, "S"], ["Luksus Våbenkit", "Accessories", 7500, 20000, "BS"], ["Våbenrensesæt", "Accessories", 10000, 70000, "BS"],
      ["9mm", "Skud", 600, 1200, "BS"], [".45 ACP", "Skud", 600, 1100, "BS"], [".50 AE", "Skud", 600, 1100, "BS"], [".38 LC", "Skud", 200, 1100, "BS"], ["44. Magnum", "Skud", 50, 1200, "BS"], ["12. Gauge", "Skud", 50, 1200, "BS"],
      ["Deagle", "Våben", 400000, 500000, "BS"], ["Heavy", "Våben", 300000, 375000, "BS"], ["Revolver", "Våben", 250000, 350000, "BS"], ["Taurus", "Våben", 200000, 350000, "BS"], ["SNS", "Våben", 30000, 225000, "BS"], ["HK P7", "Våben", 20000, 95000, "BS"],
      ["Knojern", "Småvåben", 0, 5000, "S"], ["Dagger", "Småvåben", 0, 5000, "S"], ["Machete", "Småvåben", 0, 5000, "S"],
    ];

    const $ = s => document.querySelector(s);
    const byId = id => document.getElementById(id);
    const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const money = v => Number(v || 0).toLocaleString("da-DK", { maximumFractionDigits: 2 }) + " kr";
    const dt = v => v ? new Date(v).toLocaleString("da-DK", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "–";
    const isAdmin = () => profile?.role === "admin";
    const nameOf = p => p?.full_name || "Uden navn";
    const catOf = i => i.category || "Andet";
    const value = i => Number(i.quantity || 0) * Number(i.buy_price || 0);
    const priceOf = i => Number(cashType === "ind" ? i.sell_price : i.buy_price) || 0;
    const getFee = () => { try { return localStorage.getItem("fee") || ""; } catch { return ""; } };

    function say(text = "", type = "error") {
      const m = $("#message");
      m.textContent = text;
      m.className = text ? type : "";
    }

    const cell = v => (v && v.html !== undefined) ? v.html : esc(v);
    function table(headers, rows, boldFirst = false) {
      if (!rows.length) return '<p class="muted">Ingen oplysninger endnu.</p>';
      return `<table><thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(r => `<tr>${r.map((v, n) => `<td${boldFirst && n === 0 ? ' class="name"' : ""}>${cell(v)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    }
    const card = (title, body) => `<section class="card">${title ? `<h2>${title}</h2>` : ""}${body}</section>`;
    const statCard = items => card("", `<div class="stats3">${items.map(([l, v, c]) => `<div><small>${l}</small><b style="color:${c}">${v}</b></div>`).join("")}</div>`);
    const chips = (cats, active, attr) => cats.map(c => `<button type="button" class="chip${c === active ? " on" : ""}" data-${attr}="${esc(c)}">${esc(c)}</button>`).join("");
    const must = r => { if (r.error) throw r.error; return r.data || []; };
    const list = (t, cols = "*", order = "created_at", asc = false) => db.from(t).select(cols).order(order, { ascending: asc });

    function setStats(stock) {
      $("#stats").textContent = `${stock.length} varer · lagerværdi ${money(stock.reduce((s, i) => s + value(i), 0))}`;
    }

    async function start(session) {
      const thisStart = ++startCounter;
      me = session?.user || null;
      profile = null;
      $("#auth").classList.toggle("hidden", !!me);
      $("#app").classList.toggle("hidden", !me);

      if (!me) {
        $("#content").innerHTML = ""; $("#tabs").innerHTML = "";
        $("#who").textContent = ""; $("#stats").textContent = "";
        say("");
        return;
      }

      const { data, error } = await db.from("profiles").select("id, full_name, role").eq("id", me.id).maybeSingle();
      if (thisStart !== startCounter) return;
      if (error) return say("Kunne ikke hente din profil: " + error.message);
      if (!data) return say("Din profil blev ikke fundet. Bed en administrator kontrollere profiltabellen i Supabase.");

      profile = data;
      say("");
      $("#who").textContent = `${nameOf(profile)} · ${isAdmin() ? "admin" : "medlem"}`;
      $("#tabs").innerHTML = tabs.map(t => `<button type="button" data-tab="${esc(t)}" class="${t === currentTab ? "active" : ""}">${esc(t)}</button>`).join("");
      await showTab(currentTab);
    }

    // ---------- Ind/ud ----------
    function cashHtml(entries) {
      const cats = ["Alle", ...[...new Set(stockCache.map(catOf))].sort()];
      const sum = t => entries.filter(e => e.type === t).reduce((s, e) => s + Number(e.amount || 0), 0);
      const inn = sum("ind"), ud = sum("ud");
      return `
        <section class="card">
          <div class="seg">
            <button type="button" class="${cashType === "ind" ? "on" : ""}" data-type="ind">Ind – penge ind (−lager)</button>
            <button type="button" class="${cashType === "ud" ? "on" : ""}" data-type="ud">Ud – penge ud (+lager)</button>
          </div>
          <div id="chips" class="chips">${chips(cats, cat, "cat")}</div>
          <input id="csearch" class="search" placeholder="🔍 Søg vare…">
          <div id="tiles" class="tiles"></div>
        </section>
        <section class="card"><b>Kurv</b><div id="cart" style="margin-top:6px"></div></section>
        <section class="card">
          <div class="sumline"><span>Varer</span><span id="sum">0 kr</span></div>
          <div class="pay"><b id="paylabel"></b><span id="paytotal" class="big">0 kr</span></div>
          <button type="button" id="savebtn" data-save-cart></button>
        </section>` +
        statCard([["Ind i alt", money(inn), "#1a7f37"], ["Ud i alt", money(ud), "#b42318"], ["Saldo", money(inn - ud), "#b8860b"]]) +
        card("", table(["Tid", "Type", "Indhold"], entries.slice(0, 100).map(e => [
          dt(e.created_at),
          { html: e.type === "ind" ? '<span class="pos">Ind</span>' : '<span class="neg">Ud</span>' },
          `${e.description || (e.quantity && e.stock_items ? `${e.quantity}× ${e.stock_items.name}` : "–")} → ${money(e.amount)}`
        ])));
    }

    function drawTiles() {
      const q = (byId("csearch")?.value || "").toLowerCase();
      const flag = cashType === "ind" ? "sells" : "buys";
      const items = stockCache.filter(i => i[flag] !== false && (cat === "Alle" || catOf(i) === cat) && i.name.toLowerCase().includes(q));
      byId("tiles").innerHTML = items.length ? items.map(i =>
        `<button type="button" class="tile" data-add="${esc(i.id)}"><div>${esc(i.name)}</div><span>${money(priceOf(i))} · lager ${esc(i.quantity)}</span></button>`).join("")
        : '<p class="muted">Ingen varer.</p>';
    }

    const cartLines = () => Object.entries(cart).map(([id, qty]) => ({ i: stockCache.find(s => s.id === id), qty })).filter(l => l.i);

    function drawCart(focusId) {
      const lines = cartLines();
      const total = lines.reduce((s, l) => s + l.qty * priceOf(l.i), 0);
      byId("cart").innerHTML = lines.length ? `<table><tbody>${lines.map(l => `<tr>
          <td>${esc(l.i.name)}</td>
          <td><button type="button" class="ghost sm" data-dec="${esc(l.i.id)}">−</button>
              <input type="number" min="1" step="1" class="qty" data-qty="${esc(l.i.id)}" value="${l.qty}">
              <button type="button" class="ghost sm" data-inc="${esc(l.i.id)}">+</button></td>
          <td>${money(l.qty * priceOf(l.i))}</td>
          <td><button type="button" class="danger sm" data-rm="${esc(l.i.id)}">✕</button></td></tr>`).join("")}</tbody></table>`
        : '<span class="muted">Klik på varer for at tilføje.</span>';
      byId("sum").textContent = money(total);
      byId("paytotal").textContent = money(total);
      byId("paylabel").textContent = cashType === "ind" ? "Samlet beløb ind" : "Samlet beløb ud";
      byId("savebtn").textContent = cashType === "ind" ? "Gennemfør indbetaling" : "Gennemfør udbetaling";
      if (focusId) {
        const inp = byId("cart").querySelector(`input[data-qty="${CSS.escape(focusId)}"]`);
        if (inp) { inp.focus(); inp.select(); }
      }
    }

    function addToCart(id, d, focus = false) {
      const item = stockCache.find(s => s.id === id);
      if (!item) return;
      const next = (cart[id] || 0) + d;
      if (next <= 0) delete cart[id]; else cart[id] = next;
      say("");
      drawCart(focus ? id : null);
    }

    function setQty(id, raw) {
      const n = Math.floor(Number(raw));
      if (!(n > 0)) delete cart[id]; else cart[id] = n;
      drawCart();
    }

    async function saveCart() {
      const lines = cartLines();
      if (!lines.length) return say("Kurven er tom.");
      const { error } = await db.rpc("register_cart", {
        p_type: cashType,
        p_items: lines.map(l => ({ id: l.i.id, qty: l.qty })),
        p_desc: lines.map(l => `${l.qty}× ${l.i.name}`).join(", ")
      });
      if (error) return say(error.message);
      cart = {};
      await showTab("Ind/ud");
      say("Gemt", "success");
    }

    // ---------- Lager ----------
    function stockTable(stock, admin) {
      if (!stock.length) return '<p class="muted">Ingen varer endnu.</p>';
      const heads = admin
        ? ["Vare", "Kategori", "På lager", "Købspris", "Salgspris", "Køb", "Salg", "Lagerværdi", ""]
        : ["Vare", "På lager", "Købspris", "Salgspris", "Køb", "Salg", "Lagerværdi"];
      const num = (i, f) => admin
        ? `<input class="n" type="number" min="0" step="${f === "quantity" ? 1 : 0.01}" data-id="${esc(i.id)}" data-f="${f}" value="${esc(i[f] ?? 0)}">`
        : `<input class="n" type="number" value="${esc(i[f] ?? 0)}" disabled>`;
      const chk = (i, f, label) => `<label class="fl"><input type="checkbox" ${admin ? `data-id="${esc(i.id)}" data-f="${f}"` : "disabled"}${i[f] !== false ? " checked" : ""}> ${label}</label>`;

      const groups = {};
      stock.forEach(i => (groups[catOf(i)] ||= []).push(i));
      const body = Object.keys(groups).sort().map(c =>
        `<tr class="cat" data-cat="${esc(c)}"><td colspan="${heads.length}">${esc(c)}</td></tr>` +
        groups[c].map(i => `<tr data-cat="${esc(c)}" data-name="${esc(i.name.toLowerCase())}">
          <td>${esc(i.name)}</td>
          ${admin ? `<td><input data-id="${esc(i.id)}" data-f="category" list="cats" placeholder="Kategori" value="${esc(i.category || "")}" style="width:130px"></td>` : ""}
          <td>${num(i, "quantity")}</td><td>${num(i, "buy_price")}</td><td>${num(i, "sell_price")}</td>
          <td>${chk(i, "buys", "Vi køber")}</td><td>${chk(i, "sells", "Vi sælger")}</td>
          <td id="sv-${esc(i.id)}">${money(value(i))}</td>
          ${admin ? `<td><button type="button" class="danger sm" data-del-stock="${esc(i.id)}">Slet</button></td>` : ""}
        </tr>`).join("")
      ).join("");
      return `<table><thead><tr>${heads.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`;
    }

    function applyLagerFilter() {
      const q = (byId("search")?.value || "").toLowerCase();
      document.querySelectorAll("#content tbody tr").forEach(r => {
        const wrongCat = lcat !== "Alle" && r.dataset.cat !== lcat;
        const isCat = r.classList.contains("cat");
        r.classList.toggle("hidden", wrongCat || (q !== "" && (isCat || !(r.dataset.name || "").includes(q))));
      });
    }

    async function saveField(t) {
      const id = t.dataset.id, f = t.dataset.f;
      const v = t.type === "checkbox" ? t.checked : t.type === "number" ? Number(t.value) : (t.value.trim() || null);
      const { error } = await db.from("stock_items").update({ [f]: v }).eq("id", id);
      if (error) return say(error.message);
      const item = stockCache.find(s => s.id === id);
      if (item) item[f] = v;
      if (item && byId("sv-" + id)) byId("sv-" + id).textContent = money(value(item));
      setStats(stockCache);
      say("Gemt", "success");
    }

    async function seedItems() {
      const existing = new Set(must(await list("stock_items", "name", "name", true)).map(i => i.name.toLowerCase()));
      const rows = SEED_ITEMS.filter(([n]) => !existing.has(n.toLowerCase()))
        .map(([name, category, buy_price, sell_price, f]) => ({ name, category, quantity: 0, buy_price, sell_price, buys: f.includes("B"), sells: f.includes("S") }));
      if (!rows.length) return say("Alle standardvarer findes allerede.", "success");
      await run(db.from("stock_items").insert(rows), `${rows.length} varer tilføjet`);
    }

    async function showTab(tab) {
      currentTab = tab;
      document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
      const out = $("#content");
      out.innerHTML = '<section class="card">Henter…</section>';
      say("");
      const admin = isAdmin();

      try {
        let html = "";

        if (tab === "Ind/ud") {
          const [entries, stock] = (await Promise.all([
            db.from("cash_entries").select("*, stock_items(name)").order("created_at", { ascending: false }).limit(1000),
            list("stock_items", "*", "name", true)
          ])).map(must);
          stockCache = stock;
          setStats(stock);
          html = cashHtml(entries);
        }

        if (tab === "Handler") {
          const [entries, stock] = (await Promise.all([
            db.from("cash_entries").select("*, stock_items(name)").order("created_at", { ascending: false }).limit(1000),
            list("stock_items", "*", "name", true)
          ])).map(must);
          setStats(stock);
          const shown = hType === "alle" ? entries : entries.filter(e => e.type === hType);
          const sum = t => entries.filter(e => e.type === t).reduce((s, e) => s + Number(e.amount || 0), 0);
          const inn = sum("ind"), ud = sum("ud");
          html =
            card("", `<div class="chips" style="margin:0;padding:0">
              ${[["alle", "Alle"], ["ind", "Ind"], ["ud", "Ud"]].map(([k, l]) => `<button type="button" class="chip${hType === k ? " on" : ""}" data-htype="${k}">${l}</button>`).join("")}
            </div>`) +
            statCard([["Handler", String(entries.length), "#172033"], ["Ind i alt", money(inn), "#1a7f37"], ["Ud i alt", money(ud), "#b42318"], ["Saldo", money(inn - ud), "#b8860b"]]) +
            card("Færdige handler", table(["Tid", "Type", "Varer", "Beløb"], shown.slice(0, 300).map(e => [
              dt(e.created_at),
              { html: e.type === "ind" ? '<span class="pos">Ind</span>' : '<span class="neg">Ud</span>' },
              e.description || (e.quantity && e.stock_items ? `${e.quantity}× ${e.stock_items.name}` : "–"),
              { html: `<span class="${e.type === "ind" ? "pos" : "neg"}">${e.type === "ind" ? "+" : "−"}${esc(money(e.amount))}</span>` }
            ])));
        }

        if (tab === "Lager") {
          const stock = must(await list("stock_items", "*", "name", true));
          stockCache = stock;
          setStats(stock);
          const cats = [...new Set(stock.map(catOf))].sort();
          html =
            (admin ? card("Tilføj vare", `
              <form data-form="stock" class="row">
                <input name="name" placeholder="Varenavn" required>
                <input name="category" list="cats" placeholder="Kategori">
                <input name="quantity" type="number" min="0" step="1" placeholder="Antal" style="width:90px" required>
                <input name="buy_price" type="number" min="0" step="0.01" placeholder="Købspris" style="width:110px" required>
                <input name="sell_price" type="number" min="0" step="0.01" placeholder="Salgspris" style="width:110px" required>
                <button type="submit">Tilføj</button>
              </form>
              <p class="note">Mangler du varerne fra Pawnshop? <button type="button" class="ghost sm" data-seed>Importér standardvarer</button> (springer varer over, som findes i forvejen).</p>`) : "") +
            `<datalist id="cats">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
            <section class="card">
              ${admin ? "" : '<p class="muted" style="margin-top:0">🔒 Kun administratorer kan redigere priser, varer og køb/salg-status.</p>'}
              <div class="chips">${chips(["Alle", ...cats], lcat, "lcat")}</div>
              <input id="search" class="search" placeholder="🔍 Søg vare…">
              ${stockTable(stock, admin)}
            </section>`;
        }

        if (tab === "Medlemmer") {
          const [members, paid] = (await Promise.all([
            list("profiles", "*", "email", true),
            db.from("dues").select("member_id").eq("year", now.getFullYear()).eq("month", now.getMonth() + 1).eq("paid", true)
          ])).map(must);
          const paidIds = new Set(paid.map(d => d.member_id));
          const role = m => m.role === "admin" ? "Admin" : "Medlem";
          const status = m => ({ html: paidIds.has(m.id) ? '<span class="dot on"></span><span class="pos">Betalt</span>' : '<span class="dot"></span><span class="muted">Ikke betalt</span>' });
          const kHead = `Kontingent ${months[now.getMonth()]}`;
          // E-mail vises kun for admin her, så de kan se hvilken konto de giver navn til
          const rows = members.map(m => admin ? [
            { html: `<input id="mn-${esc(m.id)}" value="${esc(m.full_name || "")}" placeholder="Navn">` },
            { html: `<span class="muted">${esc(m.email)}</span>` },
            m.id === me.id ? role(m) : { html: `<select id="mr-${esc(m.id)}">
              <option value="member"${m.role !== "admin" ? " selected" : ""}>Medlem</option>
              <option value="admin"${m.role === "admin" ? " selected" : ""}>Admin</option></select>` },
            status(m),
            { html: `<button type="button" data-save-member="${esc(m.id)}">Gem</button>` }
          ] : [nameOf(m), role(m), status(m)]);

          html = card("Medlemmer", table(admin ? ["Navn", "Konto (kun admin)", "Rolle", kHead, ""] : ["Navn", "Rolle", kHead], rows, !admin)
            + `<p class="note">Kontingent viser status for den aktuelle måned. Betalinger registreres under Kontingent.${admin ? " Nye medlemmer oprettes under Authentication → Users i Supabase og vises her automatisk. Giv dem et navn her – det er navnet alle andre ser." : ""}</p>`);
        }

        if (tab === "Kontingent") {
          const [members, paid] = (await Promise.all([
            list("profiles", "id, full_name, email", "email", true),
            db.from("dues").select("*").eq("year", period.year).eq("month", period.month).eq("paid", true)
          ])).map(must);
          const byMember = Object.fromEntries(paid.map(d => [d.member_id, d]));
          const total = paid.reduce((s, d) => s + Number(d.amount || 0), 0);

          html =
            card("", `<div class="row">
                <input id="kdate" type="date" value="${esc(payDate)}" title="Dato">
                ${admin ? `<span class="muted" style="margin-left:8px">Kontingent pr. måned:</span>
                  <input id="kfee" type="number" min="0" step="0.01" value="${esc(getFee())}" placeholder="kr." style="width:110px">` : ""}
              </div>`) +
            statCard([["Har betalt", `${paid.length} af ${members.length}`, "#1a7f37"], ["Mangler", String(members.length - paid.length), "#b42318"], ["Indbetalt", money(total), "#b8860b"]]) +
            card("Hvem har betalt for " + months[period.month - 1] + " " + period.year + "?", table(["Medlem", "Status", "Beløb", "Betalt den"].concat(admin ? [""] : []),
              members.map(m => {
                const d = byMember[m.id];
                const row = [
                  nameOf(m),
                  { html: d ? '<span class="dot on"></span><span class="pos">Betalt</span>' : '<span class="dot"></span><span class="muted">Ikke betalt</span>' },
                  d ? money(d.amount) : "–",
                  d ? dt(d.paid_at || d.created_at) : "–"
                ];
                if (admin) row.push({ html: d
                  ? `<button type="button" class="ghost" data-unpay="${esc(d.id)}">Fortryd</button>`
                  : `<button type="button" data-markpaid="${esc(m.id)}">Markér betalt</button>` });
                return row;
              }), true));
        }

        if (tab === "Kontingent-historik") {
          let q = db.from("dues").select("*, profiles(full_name)").eq("paid", true)
            .order("created_at", { ascending: false }).limit(1000);
          if (histMember) q = q.eq("member_id", histMember);
          const members = must(await list("profiles", "id, full_name, email", "email", true));
          const dues = must(await q);
          const total = dues.reduce((s, d) => s + Number(d.amount || 0), 0);

          html =
            card("", `<select id="hfilter">
                <option value="">Alle medlemmer</option>
                ${members.map(m => `<option value="${esc(m.id)}"${m.id === histMember ? " selected" : ""}>${esc(nameOf(m))}</option>`).join("")}
              </select>`) +
            statCard([["Betalinger", String(dues.length), "#172033"], ["Indbetalt i alt", money(total), "#1a7f37"]]) +
            card("", table(["Betalt den", "Medlem", "Periode", "Beløb"],
              dues.slice(0, 200).map(d => [dt(d.paid_at || d.created_at), nameOf(d.profiles), `${months[(d.month || 1) - 1]} ${d.year ?? ""}`, money(d.amount)])));
        }

        out.innerHTML = html;
        if (tab === "Ind/ud") { drawTiles(); drawCart(); }
        if (tab === "Lager") applyLagerFilter();
      } catch (err) {
        out.innerHTML = card("Noget gik galt", `<p>${esc(err.message || err)}</p>
          <p class="muted">Hvis fejlen nævner en manglende kolonne eller funktion, så kør SQL-opdateringen i Supabase.</p>`);
      }
    }

    // Kør en databasehandling, genindlæs fanen og vis resultatet
    async function run(query, okText = "Gemt") {
      const { error } = await query;
      if (error) return say(error.message);
      await showTab(currentTab);
      say(okText, "success");
    }

    $("#login").addEventListener("submit", async e => {
      e.preventDefault();
      say("");
      const { error } = await db.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#password").value });
      if (error) say("Login mislykkedes: " + error.message);
    });
    $("#logout").addEventListener("click", () => db.auth.signOut());
    $("#tabs").addEventListener("click", e => { const t = e.target.dataset?.tab; if (t) showTab(t); });

    $("#content").addEventListener("submit", e => {
      e.preventDefault();
      const f = e.target, d = Object.fromEntries(new FormData(f));
      if (f.dataset.form === "stock") {
        run(db.from("stock_items").insert({
          name: d.name, category: d.category.trim() || null, quantity: Number(d.quantity),
          buy_price: Number(d.buy_price), sell_price: Number(d.sell_price)
        }));
      }
    });

    $("#content").addEventListener("input", e => {
      const t = e.target;
      if (t.id === "csearch") drawTiles();
      if (t.id === "search") applyLagerFilter();
      if (t.id === "kfee") { try { localStorage.setItem("fee", t.value); } catch {} }
    });

    $("#content").addEventListener("keydown", e => {
      if (e.key === "Enter" && e.target.dataset?.qty) e.target.blur();
    });

    $("#content").addEventListener("change", e => {
      const t = e.target;
      if (t.dataset.qty) return setQty(t.dataset.qty, t.value);
      if (t.dataset.f) saveField(t);
      if (t.id === "kdate") {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t.value);
        if (!m) return;
        payDate = t.value;
        period.year = Number(m[1]);
        period.month = Number(m[2]);
        showTab("Kontingent");
      }
      if (t.id === "hfilter") { histMember = t.value; showTab("Kontingent-historik"); }
    });

    $("#content").addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      const ds = b.dataset;

      if (ds.type) {
        cashType = ds.type; cart = {};
        b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
        drawTiles(); drawCart();
      }
      if (ds.cat) {
        cat = ds.cat;
        b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
        drawTiles();
      }
      if (ds.lcat) {
        lcat = ds.lcat;
        b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
        applyLagerFilter();
      }
      if (ds.htype) { hType = ds.htype; showTab("Handler"); }
      if (ds.add) addToCart(ds.add, 1, true);
      if (ds.inc) addToCart(ds.inc, 1);
      if (ds.dec) addToCart(ds.dec, -1);
      if (ds.rm) { delete cart[ds.rm]; drawCart(); }
      if (ds.saveCart !== undefined) saveCart();
      if (ds.seed !== undefined) seedItems().catch(err => say(err.message));

      if (ds.delStock && confirm("Slette varen?")) {
        run(db.from("stock_items").delete().eq("id", ds.delStock), "Varen er slettet");
      }
      if (ds.saveMember) {
        const upd = { full_name: byId("mn-" + ds.saveMember).value.trim() || null };
        const sel = byId("mr-" + ds.saveMember);
        if (sel) upd.role = sel.value;
        run(db.from("profiles").update(upd).eq("id", ds.saveMember));
      }
      if (ds.markpaid) {
        const feeInput = byId("kfee");
        if (!feeInput || feeInput.value === "" || !(Number(feeInput.value) >= 0)) return say("Skriv først kontingentbeløbet øverst.");
        run(db.from("dues").insert({
          member_id: ds.markpaid, month: period.month, year: period.year,
          amount: Number(feeInput.value), paid: true, paid_at: new Date(payDate + "T12:00:00").toISOString()
        }), "Kontingent registreret");
      }
      if (ds.unpay && confirm("Fortryd betalingen?")) {
        run(db.from("dues").delete().eq("id", ds.unpay), "Betalingen er fjernet");
      }
    });

    // setTimeout undgår, at Supabase låser sig fast, når databasen kaldes inde i callbacket
    db.auth.onAuthStateChange((event, session) => setTimeout(() => start(session), 0));
  </script>
</body>
</html>
