<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Malvagos</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: #f7f6f2; color: #172033; font: 16px Arial, sans-serif; }
    input, button, select { font: inherit; padding: 10px; border: 1px solid #ccd2dc; border-radius: 7px; }
    button { cursor: pointer; background: #174ea6; color: white; border: 0; }
    button.secondary { background: #586579; }

    #auth { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .login-box { width: min(100%, 300px); padding: 14px; background: white; border: 1px solid #e8e5df; border-radius: 9px; }
    .login-box h2 { margin: 0 0 12px; font-size: 16px; color: #b98100; }
    .login-box h2 b { color: #172033; }
    .login-box h2 span { color: #d99a16; }
    #login { display: grid; gap: 6px; }
    #login label { margin-top: 3px; color: #666; font-size: 11px; }
    #login input { width: 100%; margin: 0; padding: 9px; border: 1px solid #e5e2dc; border-radius: 6px; font-size: 13px; }
    #login button { width: 100%; margin-top: 2px; padding: 9px; color: #17130a; background: #bf890b; border-radius: 6px; font-size: 13px; }
    .login-box small { display: block; margin-top: 10px; color: #777; font-size: 10px; }

    .app-shell { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
    .app-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .app-header h1 { margin: 0; font-size: 26px; }
    .card input, .card select { margin: 4px; }
    .card { overflow-x: auto; margin: 12px 0; padding: 18px; background: white; border-radius: 10px; box-shadow: 0 2px 8px #0001; }
    .card h2 { margin-top: 0; font-size: 18px; }
    nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0; }
    nav button { background: #e4e9f1; color: #172033; }
    nav button.active { background: #174ea6; color: white; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { padding: 10px; border-bottom: 1px solid #e4e7ec; text-align: left; }
    .row { display: flex; flex-wrap: wrap; align-items: center; }
    .muted { color: #667085; }
    .hidden { display: none !important; }

    #message { position: fixed; z-index: 2; top: 12px; left: 50%; transform: translateX(-50%); padding: 10px; white-space: pre-wrap; background: white; border-radius: 6px; box-shadow: 0 2px 8px #0002; }
    #message:empty { display: none; }
    #message.error { color: #a11; }
    #message.success { color: #176b37; }
  </style>
</head>
<body>
  <div id="message" role="status"></div>

  <section id="auth">
    <div class="login-box">
      <h2><span>◆</span> Malvagos <b>Login</b></h2>
      <form id="login">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="E-mail" autocomplete="username" required>
        <label for="password">Adgangskode</label>
        <input id="password" name="password" type="password" placeholder="Adgangskode" autocomplete="current-password" required>
        <button type="submit">Log ind</button>
      </form>
      <small>Kun for ansatte.</small>
    </div>
  </section>

  <section id="app" class="hidden">
    <div class="app-shell">
      <header class="app-header">
        <h1>Malvagos</h1>
        <div class="row">
          <span id="who"></span>
          <button id="logout" class="secondary" type="button" style="margin-left:8px">Log ud</button>
        </div>
      </header>
      <nav id="tabs"></nav>
      <main id="content"></main>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://awkenudlyzexprjqpvcu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_4njY-sWB9J2UTcmNmQuuDA_b5bLC4Vp";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const tabs = ["Ind/ud", "Kunder", "Lager", "Handler", "Kontingent", "Medlemmer"];
    const months = ["Januar", "Februar", "Marts", "April", "Maj", "Juni", "Juli", "August", "September", "Oktober", "November", "December"];
    let me = null, profile = null, currentTab = "Ind/ud", startCounter = 0;

    const $ = selector => document.querySelector(selector);

    const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);

    const money = value => Number(value || 0).toLocaleString("da-DK", { style: "currency", currency: "DKK" });
    const dt = value => value ? new Date(value).toLocaleString("da-DK", { dateStyle: "short", timeStyle: "short" }) : "";
    const isAdmin = () => profile?.role === "admin";
    const nameOf = p => p?.full_name || p?.email || "–";

    function say(text = "", type = "error") {
      const message = $("#message");
      message.textContent = text;
      message.className = text ? type : "";
    }

    // Værdier escapes altid, undtagen objekter af formen { html: "..." }
    const cell = v => (v && v.html !== undefined) ? v.html : esc(v);

    function table(headers, rows) {
      if (!rows.length) return '<p class="muted">Ingen oplysninger endnu.</p>';
      return `
        <table>
          <thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
          <tbody>${rows.map(r => `<tr>${r.map(v => `<td>${cell(v)}</td>`).join("")}</tr>`).join("")}</tbody>
        </table>`;
    }

    const must = result => { if (result.error) throw result.error; return result.data || []; };
    const list = (t, cols = "*", order = "created_at", asc = false) =>
      db.from(t).select(cols).order(order, { ascending: asc });

    async function start(session) {
      const thisStart = ++startCounter;
      me = session?.user || null;
      profile = null;

      $("#auth").classList.toggle("hidden", !!me);
      $("#app").classList.toggle("hidden", !me);

      if (!me) {
        $("#content").innerHTML = "";
        $("#tabs").innerHTML = "";
        $("#who").textContent = "";
        say("");
        return;
      }

      const { data, error } = await db.from("profiles")
        .select("id, full_name, role").eq("id", me.id).maybeSingle();

      if (thisStart !== startCounter) return;
      if (error) return say("Kunne ikke hente din profil: " + error.message);
      if (!data) return say("Din profil blev ikke fundet. Bed administratoren kontrollere Supabase-profiltabellen.");

      profile = data;
      say("");
      $("#who").textContent = `${profile.full_name || me.email} (${isAdmin() ? "admin" : "medlem"})`;
      $("#tabs").innerHTML = tabs.map(tab =>
        `<button type="button" data-tab="${esc(tab)}" class="${tab === currentTab ? "active" : ""}">${esc(tab)}</button>`
      ).join("");

      await showTab(currentTab);
    }

    const card = (title, body) => `<section class="card"><h2>${title}</h2>${body}</section>`;
    const form = (name, fields, label = "Gem") =>
      `<form data-form="${name}" class="row">${fields}<button type="submit">${label}</button></form>`;

    async function showTab(tab) {
      currentTab = tab;
      document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));

      const out = $("#content");
      out.innerHTML = '<section class="card">Henter…</section>';
      say("");
      const admin = isAdmin();

      try {
        let html = "";

        if (tab === "Ind/ud") {
          const [entries, items] = (await Promise.all([
            list("cash_entries"),
            db.from("cash_items").select("*").eq("active", true).order("name")
          ])).map(must);

          html =
            card("Registrér ind- eller udbetaling", form("cash", `
              <select name="type"><option value="ind">Ind</option><option value="ud">Ud</option></select>
              <input name="description" placeholder="Hvad drejer det sig om?" required>
              <input name="amount" type="number" min="0.01" step="0.01" placeholder="Beløb i kr." required>`)) +
            (admin ? card("Prisliste for Ind/ud",
              form("cashitem", `
                <input name="name" placeholder="Navn på ting" required>
                <input name="price" type="number" min="0" step="0.01" placeholder="Pris" required>`, "Tilføj") +
              items.map(i => `
                <div class="row">
                  <span>${esc(i.name)}</span>
                  <input id="cp-${esc(i.id)}" type="number" min="0" step="0.01" value="${esc(i.price)}">
                  <button type="button" data-save-cash="${esc(i.id)}">Gem pris</button>
                </div>`).join("")) : "") +
            card("Ind- og udbetalinger", table(["Dato", "Type", "Beskrivelse", "Beløb"],
              entries.map(e => [dt(e.created_at), e.type, e.description, money(e.amount)])));
        }

        if (tab === "Kunder") {
          const customers = must(await list("customers"));
          html =
            (admin ? card("Tilføj kunde", form("customer", `
              <input name="name" placeholder="Navn" required>
              <input name="phone" placeholder="Telefon">
              <input name="note" placeholder="Note">`, "Tilføj")) : "") +
            card("Kunder", table(["Navn", "Telefon", "Note"],
              customers.map(c => [c.name, c.phone || "–", c.note || "–"])));
        }

        if (tab === "Lager") {
          const stock = must(await list("stock_items", "*", "name", true));
          html =
            (admin ? card("Tilføj lagervare", form("stock", `
              <input name="name" placeholder="Varenavn" required>
              <input name="quantity" type="number" min="0" step="1" placeholder="Antal" required>`, "Tilføj")) : "") +
            card("Lager", table(["Vare", "Antal"], stock.map(i => [i.name, i.quantity])));
        }

        if (tab === "Handler") {
          const [customers, deals] = (await Promise.all([
            list("customers", "id, name", "name", true),
            list("deals", "*, customers(name)")
          ])).map(must);
          html =
            (admin ? card("Ny handel", form("deal", `
              <select name="customer_id" required>
                <option value="">Vælg kunde</option>
                ${customers.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}
              </select>
              <input name="description" placeholder="Beskrivelse" required>
              <input name="amount" type="number" min="0" step="0.01" placeholder="Beløb i kr." required>
              <select name="status">
                <option value="open">Åben</option><option value="done">Afsluttet</option>
              </select>`, "Tilføj")) : "") +
            card("Handler", table(["Dato", "Kunde", "Beskrivelse", "Beløb", "Status"],
              deals.map(d => [dt(d.created_at), d.customers?.name || "–", d.description, money(d.amount),
                d.status === "done" ? "Afsluttet" : "Åben"])));
        }

        if (tab === "Kontingent") {
          const [members, dues] = (await Promise.all([
            list("profiles", "id, full_name, email", "email", true),
            list("dues", "*, profiles(full_name, email)")
          ])).map(must);
          html =
            (admin ? card("Registrér kontingent", form("due", `
              <select name="member_id" required>
                <option value="">Vælg medlem</option>
                ${members.map(m => `<option value="${esc(m.id)}">${esc(nameOf(m))}</option>`).join("")}
              </select>
              <select name="month">
                ${months.map((m, i) => `<option value="${i + 1}">${m}</option>`).join("")}
              </select>
              <input name="year" type="number" value="${new Date().getFullYear()}" required>
              <input name="amount" type="number" min="0" step="0.01" placeholder="Beløb i kr." required>`, "Tilføj")) : "") +
            card("Kontingent", table(["Medlem", "Måned", "År", "Beløb", "Status"],
              dues.map(d => [nameOf(d.profiles), months[(d.month || 1) - 1], d.year ?? "–", money(d.amount),
                d.paid ? "Betalt" : (admin
                  ? { html: `<button type="button" data-pay="${esc(d.id)}">Markér betalt</button>` }
                  : "Ikke betalt")])));
        }

        if (tab === "Medlemmer") {
          const members = must(await list("profiles", "*", "email", true));
          html = card("Medlemmer", table(["Navn", "E-mail", "Rolle"],
            members.map(m => [m.full_name || "–", m.email, m.role === "admin" ? "Admin" : "Medlem"])));
        }

        out.innerHTML = html;
      } catch (err) {
        out.innerHTML = card("Noget gik galt", `<p>${esc(err.message || err)}</p>`);
      }
    }

    // Kør en database-handling, vis resultat og genindlæs fanen
    async function run(query, okText = "Gemt") {
      const { error } = await query;
      if (error) return say(error.message);
      await showTab(currentTab);
      say(okText, "success");
    }

    $("#login").addEventListener("submit", async e => {
      e.preventDefault();
      say("");
      const { error } = await db.auth.signInWithPassword({
        email: $("#email").value.trim(),
        password: $("#password").value
      });
      if (error) say("Login mislykkedes: " + error.message);
    });

    $("#logout").addEventListener("click", () => db.auth.signOut());

    $("#tabs").addEventListener("click", e => {
      const tab = e.target.dataset?.tab;
      if (tab) showTab(tab);
    });

    $("#content").addEventListener("submit", e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(e.target));
      const n = Number;
      const actions = {
        cash: () => db.from("cash_entries").insert({ type: d.type, description: d.description, amount: n(d.amount) }),
        cashitem: () => db.from("cash_items").insert({ name: d.name, price: n(d.price) }),
        customer: () => db.from("customers").insert({ name: d.name, phone: d.phone || null, note: d.note || null }),
        stock: () => db.from("stock_items").insert({ name: d.name, quantity: n(d.quantity) }),
        deal: () => db.from("deals").insert({ customer_id: d.customer_id, description: d.description, amount: n(d.amount), status: d.status }),
        due: () => db.from("dues").insert({ member_id: d.member_id, month: n(d.month), year: n(d.year), amount: n(d.amount) })
      };
      const action = actions[e.target.dataset.form];
      if (action) run(action());
    });

    $("#content").addEventListener("click", e => {
      const button = e.target.closest("button");
      if (!button) return;
      if (button.dataset.saveCash) {
        const id = button.dataset.saveCash;
        run(db.from("cash_items").update({ price: Number(document.getElementById("cp-" + id).value) }).eq("id", id), "Prisen er gemt");
      }
      if (button.dataset.pay) {
        run(db.from("dues").update({ paid: true }).eq("id", button.dataset.pay), "Markeret som betalt");
      }
    });

    // Starter ved sidens åbning og ved login/logout (kaldes udenfor callbacket for at undgå låsning)
    db.auth.onAuthStateChange((event, session) => setTimeout(() => start(session), 0));
  </script>
</body>
</html>
