<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Malvagos</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background: #f7f6f2;
      color: #172033;
      font: 16px Arial, sans-serif;
    }

    input, button, select {
      font: inherit;
      padding: 10px;
      border: 1px solid #ccd2dc;
      border-radius: 7px;
    }

    button {
      cursor: pointer;
      background: #174ea6;
      color: white;
      border: 0;
    }

    button.secondary { background: #586579; }

    #auth {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .login-box {
      width: min(100%, 300px);
      padding: 14px;
      background: white;
      border: 1px solid #e8e5df;
      border-radius: 9px;
    }

    .login-box h2 {
      margin: 0 0 12px;
      font-size: 16px;
      color: #b98100;
    }

    .login-box h2 b { color: #172033; }
    .login-box h2 span { color: #d99a16; }

    #login {
      display: grid;
      gap: 6px;
    }

    #login label {
      margin-top: 3px;
      color: #666;
      font-size: 11px;
    }

    #login input {
      width: 100%;
      margin: 0;
      padding: 9px;
      border: 1px solid #e5e2dc;
      border-radius: 6px;
      font-size: 13px;
    }

    #login button {
      width: 100%;
      margin-top: 2px;
      padding: 9px;
      color: #17130a;
      background: #bf890b;
      border-radius: 6px;
      font-size: 13px;
    }

    .login-box small {
      display: block;
      margin-top: 10px;
      color: #777;
      font-size: 10px;
    }

    .app-shell {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .app-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .app-header h1 {
      margin: 0;
      font-size: 26px;
    }

    input:not(#login input), select {
      margin: 4px;
    }

    .card {
      overflow-x: auto;
      margin: 12px 0;
      padding: 18px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0001;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 16px 0;
    }

    nav button {
      background: #e4e9f1;
      color: #172033;
    }

    nav button.active {
      background: #174ea6;
      color: white;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #e4e7ec;
      text-align: left;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }

    .muted { color: #667085; }
    .hidden { display: none !important; }

    #message {
      position: fixed;
      z-index: 2;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px;
      white-space: pre-wrap;
      background: white;
      border-radius: 6px;
    }

    #message.error { color: #a11; }
    #message.success { color: #176b37; }
  </style>
</head>
<body>
  <div id="message" role="status"></div>

  <section id="auth">
    <div class="login-box">
      <h2><span>◆</span> Malvagos <b>Login</b></h2>
      <form id="login">
        <label for="email">E-mail</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="E-mail"
          autocomplete="username"
          required

        <label for="password">Adgangskode</label>

          name="password"
          type="password"
          placeholder="Adgangskode"

          required

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Supabase Project URL og publishable/anon key
    const SUPABASE_URL = "https://awkenudlyzexprjqpvcu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_4njY-sWB9J2UTcmNmQuuDA_b5bLC4Vp";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const tabs = ["Ind/ud", "Kunder", "Lager", "Handler", "Kontingent", "Medlemmer"];
    let me = null;
    let profile = null;
    let currentTab = "Ind/ud";
    let startCounter = 0;

    const $ = selector => document.querySelector(selector);

    const esc = value => String(value ?? "").replace(/[&<>"']/g, character => ({
  "&": "&",
  "<": "<",
  ">": ">",
  '"': """,
  "'": "'"
})[character]);

    const money = value => Number(value || 0).toLocaleString("da-DK", {
      style: "currency",
      currency: "DKK"
    });

    function say(text = "", type = "error") {
      const message = $("#message");
      message.textContent = text;
      message.className = text ? type : "";
    }

    function table(headers, rows) {
      if (!rows.length) return '<p class="muted">Ingen oplysninger endnu.</p>';

      return `
        <table>
          <thead>
            <tr>${headers.map(header => `<th>${esc(header)}</th>`).join("")}</tr>
          </thead>
          <tbody>
            ${rows.map(row => `
              <tr>${row.map(value => `<td>${esc(value)}</td>`).join("")}</tr>
            `).join("")}
          </tbody>
        </table>`;
    }

    function isAdmin() {
      return profile?.role === "admin";
    }

    async function start(session) {
      const thisStart = ++startCounter;
      me = session?.user || null;
      profile = null;

      $("#auth").classList.toggle("hidden", !!me);
      $("#app").classList.toggle("hidden", !me);

      if (!me) {
        $("#content").innerHTML = "";
        $("#tabs").innerHTML = "";
        $("#who").textContent = "";
        say("");
        return;
      }

      const { data, error } = await db
        .from("profiles")
        .select("id, full_name, role")
        .eq("id", me.id)
        .maybeSingle();

      if (thisStart !== startCounter) return;

      if (error) {
        say("Kunne ikke hente din profil: " + error.message);
        return;
      }

      if (!data) {
        say("Din profil blev ikke fundet. Bed administratoren kontrollere Supabase-profiltabellen.");
        return;
      }

      profile = data;
      say("", "");

      $("#who").textContent =
        `${profile.full_name || me.email} (${isAdmin() ? "admin" : "medlem"})`;

      $("#tabs").innerHTML = tabs.map(tab => `
        <button type="button" data-tab="${esc(tab)}"
          class="${tab === currentTab ? "active" : ""}">${esc(tab)}</button>
      `).join("");

      await showTab(currentTab);
    }

    async function showTab(tab) {
      currentTab = tab;

      $("#tabs").querySelectorAll("button").forEach(button => {
        button.classList.toggle("active", button.dataset.tab === tab);
      });

      const out = $("#content");
      out.innerHTML = '<section class="card">Henter…</section>';
      say("");

      try {
        if (tab === "Ind/ud") {
          const [entriesResult, itemsResult] = await Promise.all([
            db.from("cash_entries").select("*").order("created_at", { ascending: false }),
            db.from("cash_items").select("*").eq("active", true).order("name")
          ]);

          if (entriesResult.error) throw entriesResult.error;
          if (itemsResult.error) throw itemsResult.error;

          const entries = entriesResult.data || [];
          const items = itemsResult.data || [];

          out.innerHTML = `
            <section class="card">
              <h2>Registrér ind- eller udbetaling</h2>
              <form data-form="cash" class="row">
                <select name="type">
                  <option value="ind">Ind</option>
                  <option value="ud">Ud</option>
                </select>
                <input name="description" placeholder="Hvad drejer det sig om?" required>
                <input name="amount" type="number" min="0.01" step="0.01"
                  placeholder="Beløb i kr." required>
                <button type="submit">Gem</button>
              </form>
            </section>

            ${isAdmin() ? `
              <section class="card">
                <h2>Prisliste for Ind/ud</h2>
                <form data-form="cashitem" class="row">
                  <input name="name" placeholder="Navn på ting" required>
                  <input name="price" type="number" min="0" step="0.01"
                    placeholder="Pris" required>
                  <button type="submit">Tilføj</button>
                </form>
                ${items.map(item => `
                  <div class="row">
                    <span>${esc(item.name)}</span>
                    <input id="cp-${esc(item.id)}" type="number" min="0" step="0.01"
                      value="${esc(item.price)}">
                    <button type="button" data-save-cash="${esc(item.id)}">Gem pris</button>
                  </div>
                `).join("")}
              </section>
            ` : ""}

            <section class="card">
              <h2>Ind- og udbetalinger</h2>
              ${table(["Dato", "Type", "Beskrivelse", "Beløb"],
                entries.map(entry => [
                  entry.created_at, entry.type, entry.description, money(entry.amount)
                ]))}
            </section>`;
        }

        if (tab === "Lager") {
          const { data, error } = await db
            .from("stock_items").select("*").order("name");

          if (error) throw error;

          out.innerHTML = `
            ${isAdmin() ? `
              <section class="card">
                <h2>Tilføj lagervare</h2>
                <form data-form="stock" class="row">
                  <input name="name" placeholder="Varenavn" required>
                  <input name="quantity" type="number"

                  <input name="quantity" type="number" id="lagerAntalInput" placeholder="Antal" min="0" style="display:none;">

<!-- ======================= LAGER SEKTION ======================= -->

<script>
/* =========================================================
   SUPABASE OPSÆTNING
   Udskift disse to linjer med dine egne, hvis de ikke allerede
   er sat tidligere i filen.
   ========================================================= */
const SUPABASE_URL = "https://DIT-PROJEKT.supabase.co";
const SUPABASE_ANON_KEY = "DIN-ANON-KEY";

// Hvis supabase-client allerede er oprettet tidligere i filen
// (f.eks. som "supabase" eller "client"), så brug den i stedet
// for at oprette en ny her. Fjern linjen nedenfor hvis det er tilfældet.
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================================================
   LAGER
   Tabel: lager (id, navn, antal, pris)
   ========================================================= */
const lagerForm = document.getElementById('lagerForm');
const lagerTabel = document.getElementById('lagerTabel');
const lagerAnnuller = document.getElementById('lagerAnnuller');

async function hentLager() {
  const { data, error } = await supabaseClient
    .from('lager')
    .select('*')
    .order('navn', { ascending: true });

  if (error) {
    console.error('Fejl ved hentning af lager:', error);
    return;
  }

  lagerTabel.innerHTML = '';
  data.forEach(vare => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${vare.navn}</td>
      <td>${vare.antal}</td>
      <td>${vare.pris.toFixed(2)} kr</td>
      <td>
        <button onclick="redigerLager('${vare.id}')">Rediger</button>
        <button onclick="sletLager('${vare.id}')">Slet</button>
      </td>
    `;
    lagerTabel.appendChild(row);
  });

  opdaterVareDropdown(data);
}

lagerForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const id = document.getElementById('lagerId').value;
  const navn = document.getElementById('lagerNavn').value;
  const antal = parseInt(document.getElementById('lagerAntal').value);
  const pris = parseFloat(document.getElementById('lagerPris').value);

  if (id) {
    const { error } = await supabaseClient
      .from('lager')
      .update({ navn, antal, pris })
      .eq('id', id);

    if (error) {
      alert('Fejl ved opdatering: ' + error.message);
      return;
    }
  } else {
    const { error } = await supabaseClient
      .from('lager')
      .insert([{ navn, antal, pris }]);

    if (error) {
      alert('Fejl ved oprettelse: ' + error.message);
      return;
    }
  }

  lagerForm.reset();
  document.getElementById('lagerId').value = '';
  lagerAnnuller.style.display = 'none';
  hentLager();
});

async function redigerLager(id) {
  const { data, error } = await supabaseClient
    .from('lager')
    .select('*')
    .eq('id', id)
    .single();

  if (error) {
    alert('Fejl ved hentning af vare: ' + error.message);
    return;
  }

  document.getElementById('lagerId').value = data.id;
  document.getElementById('lagerNavn').value = data.navn;
  document.getElementById('lagerAntal').value = data.antal;
  document.getElementById('lagerPris').value = data.pris;
  lagerAnnuller.style.display = 'inline-block';
}

lagerAnnuller.addEventListener('click', () => {
  lagerForm.reset();
  document.getElementById('lagerId').value = '';
  lagerAnnuller.style.display = 'none';
});

async function sletLager(id) {
  if (!confirm('Er du sikker på at du vil slette denne vare?')) return;

  const { error } = await supabaseClient
    .from('lager')
    .delete()
    .eq('id', id);

  if (error) {
    alert('Fejl ved sletning: ' + error.message);
    return;
  }

  hentLager();
}

/* =========================================================
   KUNDER
   Tabel: kunder (id, navn, telefon, email)
   ========================================================= */
const kundeForm = document.getElementById('kundeForm');
const kunderTabel = document.getElementById('kunderTabel');
const kundeAnnuller = document.getElementById('kundeAnnuller');

async function hentKunder() {
  const { data, error } = await supabaseClient
    .from('kunder')
    .select('*')
    .order('navn', { ascending: true });

  if (error) {
    console.error('Fejl ved hentning af kunder:', error);
    return;
  }

  kunderTabel.innerHTML = '';
  data.forEach(kunde => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${kunde.navn}</td>
      <td>${kunde.telefon || '-'}</td>
      <td>${kunde.email || '-'}</td>
      <td>
        <button onclick="redigerKunde('${kunde.id}')">Rediger</button>
        <button onclick="sletKunde('${kunde.id}')">Slet</button>
      </td>
    `;
    kunderTabel.appendChild(row);
  });

  opdaterKundeDropdown(data);
}

kundeForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const id = document.getElementById('kundeId').value;
  const navn = document.getElementById('kundeNavn').value;
  const telefon = document.getElementById('kundeTelefon').value;

  if (id) {
    const { error } = await supabaseClient
      .from('kunder')
      .update({ navn, telefon, email })
      .eq('id', id);

    if (error) {
